<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* layout: a mesma coluna estreita de caixas com bordas retas de 1px do gerador de ruído branco */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --mute: #8a8a8a;
  --line: #111111;
  --faint: #e6e6e6;
  --display: "Silkscreen", "VT323", ui-monospace, monospace;
  --body: "VT323", ui-monospace, "Courier New", monospace;
  --kd: 1; --kb: 1;  /* escala das letras: o estilo minimalista usa letra comum, menor por px que a VT323 */
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { background: var(--paper); color: var(--ink); }
body {
  margin: 0;
  font-family: var(--body);
  font-size: calc(20px * var(--kb));
  line-height: 1.25;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 {
  font-family: var(--display); font-weight: 400; font-size: calc(28px * var(--kd));
  letter-spacing: .04em; margin: 0; text-wrap: balance;
}
.sub { margin: 0; color: var(--mute); }
.box { border: 1px solid var(--line); }
.box > .hd {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--line);
  padding: 4px 10px;
  font-family: var(--display); font-size: calc(11px * var(--kd)); letter-spacing: .12em; text-transform: uppercase;
}
.box > .bd { padding: 12px 10px; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 1px dashed var(--ink); outline-offset: 3px; }

/* exercício */
.q { min-height: 250px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 22px 14px !important; }
.ctx { margin: 0; font-size: calc(22px * var(--kb)); text-wrap: pretty; }
.ctx:empty { display: none; }
.ctx b { font-weight: 400; background: var(--ink); color: var(--paper); padding: 0 4px; }
.expr {
  font-family: var(--display); font-size: calc(34px * var(--kd)); letter-spacing: .04em;
  line-height: 1.2; overflow-wrap: anywhere; text-align: center; padding: 6px 0;
}
.expr:empty { display: none; }
.expr sup { font-size: .55em; vertical-align: .9em; line-height: 0; }
.expr sub { font-size: .55em; line-height: 0; }
form { display: grid; grid-template-columns: 1fr auto auto; gap: 0; }
#ans {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-right: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--display); font-size: calc(26px * var(--kd)); letter-spacing: .06em;
  padding: 8px 10px; text-align: center;
}
#ans::placeholder { color: var(--faint); }
#ans:disabled { color: var(--ink); -webkit-text-fill-color: var(--ink); opacity: 1; }
#ok {
  border: 1px solid var(--line); background: var(--ink); color: var(--paper);
  font-family: var(--display); font-size: calc(16px * var(--kd)); letter-spacing: .1em; padding: 0 18px; cursor: pointer;
}
.fb { min-height: 1.3em; font-family: var(--display); font-size: calc(14px * var(--kd)); letter-spacing: .1em; text-align: center; }
.how { font-size: calc(20px * var(--kb)); padding: 8px 10px; border: 1px solid var(--faint); margin: 0; overflow-wrap: anywhere; }
.how:empty { display: none; }
.how sup { font-size: .7em; }
.foot { display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
#help {
  display: flex; align-items: center; padding: 0 16px; border-right: 1px solid var(--line);
  font-family: var(--display); font-size: calc(16px * var(--kd)); letter-spacing: .1em; text-decoration: none; color: var(--ink); white-space: nowrap;
}
#help:hover { background: var(--ink); color: var(--paper); }
#help:focus-visible { outline: 1px dashed var(--ink); outline-offset: -4px; }
#act {
  width: 100%; border: 0; background: var(--paper);
  font-family: var(--display); font-size: calc(16px * var(--kd)); letter-spacing: .1em; padding: 12px 10px; cursor: pointer;
}
#act:hover { background: var(--ink); color: var(--paper); }
#act.go { background: var(--ink); color: var(--paper); }
.key { color: var(--mute); font-size: calc(12px * var(--kd)); }
#act:hover .key, #act.go .key { color: var(--faint); }

/* teclado na tela: só em telas de toque */
.pad { display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pad button {
  border: 1px solid var(--line); background: var(--paper); height: 56px;
  font-family: var(--display); font-size: calc(24px * var(--kd)); cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.pad button:active { background: var(--ink); color: var(--paper); }
.pad #padOk { background: var(--ink); color: var(--paper); font-size: calc(18px * var(--kb)); letter-spacing: .1em; }
.pad #padOk:active { background: var(--paper); color: var(--ink); }
@media (pointer: coarse), (hover: none) {
  .pad { display: grid; }
  #ok { display: none; }
  #ans { border-right: 1px solid var(--line); caret-color: transparent; }
  .q { min-height: 0; padding: 16px 12px !important; gap: 10px; }
  #act .key { display: none; }
  body { padding-top: 20px; }
}

/* desempenho */
canvas { display: block; width: 100%; height: 96px; image-rendering: pixelated; }
.axis { display: flex; justify-content: space-between; color: var(--mute); font-size: calc(16px * var(--kb)); padding: 2px 10px 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.stats div { padding: 6px 10px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats span { display: block; font-family: var(--display); font-size: calc(10px * var(--kd)); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.stats output { font-size: calc(26px * var(--kb)); font-variant-numeric: tabular-nums; }

/* ajustes */
.hd button { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--display); font-size: calc(11px * var(--kd)); letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 3px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5em, 1fr)); gap: 6px; }
.chip, .seg button {
  border: 1px solid var(--line); background: var(--paper); padding: 4px 8px;
  text-align: left; cursor: pointer; font-size: calc(19px * var(--kb)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip::before { content: "□ "; }
.chip[aria-pressed="true"]::before { content: "■ "; }
.chip:hover { background: var(--faint); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); }
.rt { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 10px; align-items: center; }
.rt .n { white-space: nowrap; }
.rt .bar { height: 12px; border: 1px solid var(--faint); position: relative; }
.rt .bar i { position: absolute; inset: 1px auto 1px 1px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 8px); }
.rt .v { text-align: right; font-variant-numeric: tabular-nums; min-width: 2.6em; }
.rt .l { font-family: var(--display); font-size: calc(10px * var(--kd)); letter-spacing: .1em; color: var(--mute); min-width: 4.5em; }
.rt .off { color: var(--mute); }
.rt .off .bar i { opacity: .3; }
.rt .now { background: var(--ink); color: var(--paper); padding: 0 4px; margin-left: -4px; }
.d { color: var(--mute); }
.seg button { text-align: center; font-family: var(--display); font-size: calc(13px * var(--kd)); letter-spacing: .1em; padding: 10px 4px; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* valores de referência */
.def p { margin: 0 0 10px; max-width: 62ch; }
.def p:last-child { margin-bottom: 0; }
.eq { font-size: calc(21px * var(--kb)); padding: 6px 10px; border: 1px solid var(--faint); margin: 0 0 6px; overflow-x: auto; white-space: nowrap; display: flex; justify-content: space-between; gap: 16px; }
.eq span:last-child { color: var(--mute); }
.note { color: var(--mute); font-size: calc(17px * var(--kb)); }

@media (max-width: 440px) {
  .seg button { font-size: calc(11px * var(--kd)); letter-spacing: .04em; }
  .expr { font-size: calc(28px * var(--kb)); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stats div:nth-child(3) { border-left: 0; }
  .stats div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .eq { white-space: normal; flex-direction: column; gap: 0; }
}
